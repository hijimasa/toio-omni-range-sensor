; Timer Camera F : MJPEG streaming firmware
;
; Board definition already provides -DBOARD_HAS_PSRAM and the ESP32 PSRAM
; cache workaround flags, so they are not repeated here.

[env:timercam_f]
platform      = espressif32
board         = m5stack-timer-cam
framework     = arduino
monitor_speed = 115200
; The stub flasher loads fine but stops responding as soon as esptool switches
; to a higher rate on this unit's FT232, so stay at the connect baud.
upload_speed  = 115200

; 4MB flash: the default partition table leaves ~1.2MB for the app which is
; tight once WiFi + esp_http_server + the camera driver are linked in.
board_build.partitions = huge_app.csv

lib_deps =
    ; 1.4.x targets arduino-esp32 2.x; on 3.x (IDF 5.5) NimBLEDevice::init aborts.
    h2zero/NimBLE-Arduino @ ^2.2.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
